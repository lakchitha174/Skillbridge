<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Create your SkillBridge account"><title>Create account | SkillBridge</title><link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
  <main class="auth-shell register-shell">
    <section class="brand-panel"><a class="brand" href="index.html" aria-label="SkillBridge home"><span class="brand-mark">S</span>SkillBridge</a><div class="brand-copy"><p class="eyebrow">START YOUR JOURNEY</p><h1>Your potential<br>has a <em>path.</em></h1><p>Join a supportive learning space designed to move you from ambition to opportunity.</p></div><div class="stat-card"><span class="stat-icon">✦</span><div><strong>1:1</strong><small>mentor guidance when you need it</small></div></div></section>
    <section class="form-panel"><div class="form-wrap"><p class="eyebrow accent">CREATE ACCOUNT</p><h2>Begin with SkillBridge</h2><p class="muted">A few details and you're ready to grow.</p>
      <form id="registerForm" novalidate>
        <label for="registerName">Full name</label><input id="registerName" name="name" type="text" autocomplete="name" placeholder="Your full name" required minlength="2">
        <label for="registerEmail">Email address</label><input id="registerEmail" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
        <label for="registerPassword">Create password</label><div class="password-field"><input id="registerPassword" name="password" type="password" autocomplete="new-password" placeholder="At least 6 characters" required minlength="6"><button class="visibility-toggle" type="button" aria-label="Show password" aria-pressed="false">Show</button></div>
        <label for="confirmPassword">Confirm password</label><div class="password-field"><input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" placeholder="Re-enter your password" required><button class="visibility-toggle" type="button" aria-label="Show password" aria-pressed="false">Show</button></div>
        <p id="formMessage" class="form-message" role="alert" aria-live="polite"></p><button class="primary-button" type="submit">Create my account <span>→</span></button>
      </form><p class="auth-switch">Already have an account? <a href="index.html">Sign in</a></p></div></section>
  </main><script src="script.js"></script>
</body>
</html>
